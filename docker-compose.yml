services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Substituted into the realm file when it is imported
      INDEXING_APP_CLIENT_SECRET: ${INDEXING_APP_CLIENT_SECRET}
      KEYCLOAK_DEMO_PASSWORD: ${KEYCLOAK_DEMO_PASSWORD}
    volumes:
      - keycloak-data:/opt/keycloak/data
      # The realm 'Alive' is imported on startup, unless it already exists
      - ./keycloak/alive-realm.json:/opt/keycloak/data/import/alive-realm.json:ro
    command: start-dev --import-realm
    healthcheck:
      # The image has no curl, so the health endpoint on the management port is called through bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mariadb:
    image: mariadb:11.6.2
    container_name: mariadb
    ports:
      - "3306:3306"
      # Extra port so the container can be reached from the host while a native MariaDB occupies 3306
      - "3316:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      # Only applied when the data volume is empty (first start)
      MARIADB_DATABASE: churchmedia
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  file-server:
    image: ghcr.io/jorgenrunemortensen/file-server:${IMAGE_TAG:-latest}
    container_name: file-server
    ports:
      - "8085:8085"
    volumes:
      - ${MEDIA_ROOT:-./media}:/data
    restart: unless-stopped
    environment:
        - APP_ROOT_FOLDER=/data
        - DEFAULT_FILE_DEPTH=2
        - MAX_MAINTENANCE_CONCURRENT_THREADS=4
    healthcheck:
      # The application accepts connections (curl is not available in every base image)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8085"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  content-app:
    image: ghcr.io/jorgenrunemortensen/churchmedia-content-app:${IMAGE_TAG:-latest}
    container_name: content-app
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - TZ=Europe/Copenhagen
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/churchmedia
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      # Tokens are issued via http://localhost:8080 (the browser), but the signing keys are fetched internally from the keycloak container
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/Alive
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/Alive/protocol/openid-connect/certs
    healthcheck:
      # The application accepts connections (curl is not available in every base image)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  indexing-app:
    image: ghcr.io/jorgenrunemortensen/churchmedia-index-app:${IMAGE_TAG:-latest}
    container_name: indexing-app
    ports:
      - "8086:8086"
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      content-app:
        condition: service_healthy
    environment:
      - TZ=Europe/Copenhagen
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI=http://keycloak:8080/realms/Alive/protocol/openid-connect/token
      - KEYCLOAK_CLIENT_SECRET=${INDEXING_APP_CLIENT_SECRET}
      - CONTENT_APP_API_BASE_URL=http://content-app:8081
    healthcheck:
      # The application accepts connections (curl is not available in every base image)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8086"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Web UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      # Not rabbitmq-diagnostics: run as root before the broker has started, it creates a root-owned .erlang.cookie the broker cannot read
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/5672"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  keycloak-data:
  mariadb-data:
  elasticsearch-data:
  rabbitmq-data:
