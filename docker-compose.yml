services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - keycloak-data:/opt/keycloak/data
    command: start-dev

  mariadb:
    image: mariadb:11.6.2
    container_name: mariadb
    ports:
      - "3306:3306"
      # Extra port so the container can be reached from the host while a native MariaDB occupies 3306
      - "3316:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      # Only applied when the data volume is empty (first start)
      MARIADB_DATABASE: churchmedia
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql

  file-server:
    build:
      context: ..
      dockerfile: file-server/Dockerfile
    image: file-server:latest
    container_name: file-server
    ports:
      - "8085:8085"
    volumes:
      - ${MEDIA_ROOT:-./media}:/data
    restart: unless-stopped
    environment:
        - APP_ROOT_FOLDER=/data
        - DEFAULT_FILE_DEPTH=2
        - MAX_MAINTENANCE_CONCURRENT_THREADS=4

  content-app:
    build:
      context: ../content-app
      dockerfile: Dockerfile
      additional_contexts:
        common-src: ../../common
    image: content-app:latest
    container_name: content-app
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      - mariadb
      - keycloak
      - rabbitmq
    environment:
      - TZ=Europe/Copenhagen
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/churchmedia
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      # Tokens are issued via http://localhost:8080 (the browser), but the signing keys are fetched internally from the keycloak container
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/Alive
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/Alive/protocol/openid-connect/certs

  indexing-app:
    build:
      context: ../indexing-app
      dockerfile: Dockerfile
      additional_contexts:
        common-src: ../../common
    image: indexing-app:latest
    container_name: indexing-app
    ports:
      - "8086:8086"
    restart: unless-stopped
    depends_on:
      - elasticsearch
      - rabbitmq
      - keycloak
      - content-app
    environment:
      - TZ=Europe/Copenhagen
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI=http://keycloak:8080/realms/Alive/protocol/openid-connect/token
      - KEYCLOAK_CLIENT_SECRET=${INDEXING_APP_CLIENT_SECRET}
      - CONTENT_APP_API_BASE_URL=http://content-app:8081

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Web UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  keycloak-data:
  mariadb-data:
  elasticsearch-data:
  rabbitmq-data:
